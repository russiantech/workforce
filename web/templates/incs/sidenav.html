<div class="iq-sidebar  sidebar-default ">
    <div class="iq-sidebar-logo d-flex align-items-center justify-content-between">
        <a href="/" class="header-logo">
            <img src="{{url_for('static', filename=config['LOGO']['main_logo'])}}" class="img-fluid rounded-normal light-logo" alt="logo">
            <h5 class="logo-title light-logo ml-3">Dunistech</h5>
        </a>
        <div class="iq-menu-bt-sidebar ml-0" style="cursor:pointer">
            <i class="las la-bars wrapper-menu"></i>
        </div>
    </div>
    <div class="data-scrollbar" data-scroll="1" data-scrollbar="true" tabindex="-1"
        style="overflow: hidden; outline: none;">
        <div class="scroll-content">
            <nav class="iq-sidebar-menu">
                
                <ul id="iq-sidebar-toggle" class="iq-menu">
                    <li class="{% if is_active('main.index')  %}active text-warning{% endif %}">
                        <a href="/" class="svg-icon">
                            <svg class="svg-icon" id="p-dash1" width="20" height="20" xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                                </path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                            <span class="ml-4">Overview</span>
                        </a>
                    </li>

                    <li class="{% if is_active('auth.update') %} active text-warning {% endif %}">
                        <a href="{{url_for('auth.update', username=current_user.username)}}">
                            <i class="ri-user-star-line"></i>
                            <span class="ml-4">My Account</span>
                        </a>
                    </li>

                    <li class="{% if is_active('project_views.projects_dashboard') or is_active('project_views.project_board') %} active text-warning {% endif %}">
                        <a href="{{ url_for('project_views.projects_dashboard') }}">
                            <i class="ri-folder-2-line"></i>
                            <span class="ml-4">Projects </span>
                        </a>
                    </li>

                    <li class="{% if is_active('daily_task_views.daily_tasks_page') %} active text-warning {% endif %}">
                        <a href="{{ url_for('daily_task_views.daily_tasks_page') }}">
                            <i class="ri-list-check-2"></i>
                            <span class="ml-4">My Tasks</span>
                        </a>
                    </li>
                    
                    <li class="{% if is_active('roles_views.my_role_page') %} active text-success {% endif %}">
                        <a href="/roles/my-role">
                            <i class="ri-user-star-line"></i>
                            <span class="ml-4">My Roles</span>
                        </a>
                    </li>
                    
                    <li class="{% if is_active('attendance_views.attendance_page') %} active text-warning {% endif %}">
                        <a href="{{ url_for('attendance_views.attendance_page') }}">
                             <i class="ri-calendar-check-line"></i>
                            <span class="ml-4">My Attendance</span>
                        </a>
                    </li>

                    {% if current_user|has_role(['hr', 'md', 'dev', 'md', 'admin']) %}
                    
                    <li class="{% if is_active('roles_views.roles_admin') %} active text-warning {% endif %}">
                        <a href="/roles/admin">
                            <i class="ri-briefcase-line"></i>
                            <span class="ml-4">Manage Roles</span>
                        </a>
                    </li>

                    <li class="{% if is_active('auth.users') %} active text-warning {% endif %}">
                        <a href="{{url_for('main.users')}}">
                            <i class="las la-users" style="font-size:25px"></i>
                            <span class="ml-4">Users</span>
                            
                        </a>
                    </li>

                    {% endif %}
                    
                </ul>
            </nav>
            <div id="sidebar-bottom" class="position-relative sidebar-bottom">
                <div class="card border-none">
                    <div class="card-body p-0">
                        <div class="sidebarbottom-content">
                            <div class="image"><img src="{{url_for('static', filename='images/layouts/worka.jpg')}}" class="img-fluid"
                                    alt="side-bkg"></div>
                            <h6 class="mt-4 px-4 body-title">Being curious...?</h6>
                            <a href="https://dunistech.ng" class="btn sidebar-bottom-btn mt-4">Go to weebsite</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-3"></div>
        </div>
        <div class="scrollbar-track scrollbar-track-x" style="display: none;">
            <div class="scrollbar-thumb scrollbar-thumb-x" style="width: 260px; transform: translate3d(0px, 0px, 0px);">
            </div>
        </div>
        <div class="scrollbar-track scrollbar-track-y" style="display: block;">
            <div class="scrollbar-thumb scrollbar-thumb-y"
                style="height: 986.513px; transform: translate3d(0px, 0px, 0px);"></div>
        </div>
    </div>
</div>
