{% extends "base.html" %}
{% block title %}My Role — Workforce{% endblock %}

{% block head_extra %}
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --ff:        'DM Sans', system-ui, sans-serif;
  --ff-mono:   'DM Mono', monospace;
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --border:    #e3e8f0;
  --text:      #111827;
  --muted:     #64748b;
  --subtle:    #94a3b8;
  --primary:   #2563eb;
  --primary-lt:#eff6ff;
  --radius:    18px;
  --radius-sm: 10px;
  --shadow:    0 1px 3px rgba(0,0,0,.06), 0 6px 24px rgba(0,0,0,.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.1);

  /* Role accent — overridden by JS */
  --accent:    #2563eb;
  --accent-lt: #eff6ff;
}
body { background: var(--bg); font-family: var(--ff); color: var(--text); margin: 0; }

/* ── TOP BAR ─────────────────────────────────────────── */
.mr-topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 2rem; height: 60px;
  display: flex; align-items: center; gap: .7rem;
  position: sticky; top: 0; z-index: 200;
}
.btn-home {
  height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer; font-size: .8rem;
  display: inline-flex; align-items: center; gap: .35rem; padding: 0 .8rem;
  font-family: var(--ff); font-weight: 500; text-decoration: none;
  transition: border-color .15s, color .15s;
}
.btn-home:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.mr-topbar-title { font-size: .98rem; font-weight: 600; }

/* ── LAYOUT ──────────────────────────────────────────── */
.mr-layout {
  max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem;
  display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start;
}
@media(max-width:820px) { .mr-layout { grid-template-columns: 1fr; padding: 1.25rem 1rem; } }

/* ── IDENTITY CARD ───────────────────────────────────── */
.id-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  position: sticky; top: 80px; box-shadow: var(--shadow);
}
.id-card-banner {
  height: 72px; position: relative;
  background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 60%, #000) 100%);
}
.id-card-av-wrap { position: absolute; bottom: -32px; left: 1.25rem; }
.id-av {
  width: 64px; height: 64px; border-radius: 50%;
  border: 3px solid var(--surface); overflow: hidden;
  background: var(--accent-lt); color: var(--accent);
  font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.id-av img { width: 100%; height: 100%; object-fit: cover; }
.id-body { padding: 2.5rem 1.25rem 1.4rem; }
.id-name   { font-size: 1.05rem; font-weight: 700; margin-bottom: .15rem; }
.id-role-title {
  font-size: .85rem; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: .4rem; margin-bottom: .35rem;
}
.id-meta   { font-size: .77rem; color: var(--muted); line-height: 1.7; }
.id-since  { font-size: .72rem; color: var(--subtle); margin-top: .5rem;
  display: flex; align-items: center; gap: .3rem; }

.id-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1.1rem; }
.id-stat {
  background: var(--bg); border-radius: var(--radius-sm); padding: .7rem .8rem;
  text-align: center;
}
.id-stat-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); font-family: var(--ff-mono); line-height: 1; }
.id-stat-lbl { font-size: .68rem; color: var(--muted); margin-top: .2rem; text-transform: uppercase; letter-spacing: .05em; }

.no-role-card {
  background: var(--surface); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 2.5rem 1.5rem; text-align: center;
}
.no-role-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-lt); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem; }

/* ── MAIN CONTENT ────────────────────────────────────── */
.mr-content { display: flex; flex-direction: column; gap: 1.25rem; }

.mr-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  animation: fadeUp .3s ease both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.mr-section:nth-child(1){animation-delay:.05s}
.mr-section:nth-child(2){animation-delay:.1s}
.mr-section:nth-child(3){animation-delay:.15s}
.mr-section:nth-child(4){animation-delay:.2s}

.mr-section-head {
  padding: .9rem 1.4rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: .6rem;
}
.mr-section-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent-lt); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0;
}
.mr-section-title { font-size: .9rem; font-weight: 700; }
.mr-section-count { margin-left: auto; font-size: .7rem; font-family: var(--ff-mono); background: var(--bg); color: var(--muted); padding: 2px 8px; border-radius: 99px; }
.mr-section-body { padding: 1.25rem 1.4rem; }

/* Description block */
.desc-block { font-size: .88rem; line-height: 1.75; color: var(--muted); }

/* Duties list */
.duty-list { display: flex; flex-direction: column; gap: 0; }
.duty-row {
  display: flex; align-items: flex-start; gap: .85rem;
  padding: .75rem 0; border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.duty-row:last-child { border-bottom: none; padding-bottom: 0; }
.duty-num {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--accent-lt); color: var(--accent);
  font-size: .68rem; font-weight: 700; font-family: var(--ff-mono);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.duty-text { font-size: .86rem; line-height: 1.55; }

/* KPI cards */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .75rem; }
.kpi-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: .85rem .9rem; display: flex; align-items: flex-start; gap: .6rem;
  transition: border-color .15s, box-shadow .15s;
}
.kpi-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lt); }
.kpi-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
.kpi-text { font-size: .81rem; font-weight: 500; line-height: 1.5; }

/* Requirements */
.req-list { display: flex; flex-direction: column; gap: .5rem; }
.req-row {
  display: flex; align-items: center; gap: .7rem;
  background: var(--accent-lt); border-radius: var(--radius-sm);
  padding: .6rem .9rem; font-size: .84rem;
}
.req-icon { color: var(--accent); font-size: .9rem; flex-shrink: 0; }

/* My tasks summary */
.task-preview-row {
  display: flex; align-items: center; gap: .75rem; padding: .65rem 0;
  border-bottom: 1px solid var(--border); font-size: .84rem;
}
.task-preview-row:last-child { border-bottom: none; }
.tp-pri { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tp-status { font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.tp-pending   { background:#e0e7ff;color:#3730a3; }
.tp-on-going  { background:#dbeafe;color:#1d4ed8; }
.tp-stucked   { background:#fef3c7;color:#92400e; }
.tp-completed { background:#d1fae5;color:#065f46; }
.tp-cancelled { background:#fee2e2;color:#991b1b; }

/* Role catalogue tab (if no role assigned) */
.catalogue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .85rem; }
.cat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: box-shadow .15s, transform .12s;
}
.cat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.cat-accent { height: 4px; }
.cat-body { padding: .9rem; }
.cat-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; margin-bottom: .65rem; }
.cat-title { font-size: .88rem; font-weight: 700; }
.cat-dept { font-size: .72rem; color: var(--muted); }

/* Shimmer */
.shimmer { background:linear-gradient(90deg,var(--border) 25%,#f8fafc 50%,var(--border) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--radius-sm); }
@keyframes sh{to{background-position:-200% 0}}

/* Toast */
#wf-toasts{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem;pointer-events:none;}
.wf-toast{background:var(--text);color:#fff;border-radius:10px;padding:.65rem 1rem;font-size:.82rem;font-family:var(--ff);display:flex;align-items:center;gap:.6rem;pointer-events:all;box-shadow:var(--shadow-lg);animation:tin .22s ease;max-width:280px;}
.wf-toast.success{background:#065f46;}.wf-toast.danger{background:#991b1b;}.wf-toast.warning{background:#78350f;}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
{% endblock %}

{% block content %}
<!-- ── TOP BAR ──────────────────────────────────────── -->
<div class="mr-topbar">
  <a href="/" class="btn-home"><i class="ri-home-4-line"></i><span class="d-none d-sm-inline">Home</span></a>
  <a href="/projects" class="btn-home"><i class="ri-kanban-view"></i><span class="d-none d-md-inline">Projects</span></a>
  <span style="color:var(--border)">|</span>
  <span class="mr-topbar-title"><i class="ri-id-card-line" style="color:var(--accent);margin-right:.4rem"></i>My Role &amp; Responsibilities</span>
</div>

<!-- ── MAIN LAYOUT ──────────────────────────────────── -->
<div class="mr-layout" id="mrLayout">
  <!-- Loading shimmer -->
  <div class="id-card"><div class="shimmer" style="height:280px"></div></div>
  <div style="display:flex;flex-direction:column;gap:1.25rem">
    <div class="mr-section"><div class="shimmer" style="height:120px"></div></div>
    <div class="mr-section"><div class="shimmer" style="height:200px"></div></div>
  </div>
</div>

<div id="wf-toasts"></div>
{% endblock %}

{% block scripts %}
<script>
const CURRENT_USER = {{ current_user_json | tojson }};   {# pass from Flask route #}

document.addEventListener('DOMContentLoaded', () => loadMyRole());

async function loadMyRole() {
  try {
    const [roleData, taskData] = await Promise.all([
      api('/api/my-role'),
      api('/api/v2/tasks?my_tasks=true&per_page=10').catch(() => ({ tasks: [] }))
    ]);
    render(roleData, taskData.tasks || []);
  } catch(e) { renderError(e.message); }
}

function render(data, tasks) {
  const layout = document.getElementById('mrLayout');
  const { assignment, role } = data;

  if (!assignment || !role) {
    renderNoRole(layout, tasks);
    return;
  }

  // Apply accent colour
  document.documentElement.style.setProperty('--accent',    role.color || '#2563eb');
  document.documentElement.style.setProperty('--accent-lt', (role.color || '#2563eb') + '1a');

  const userName  = (CURRENT_USER?.name||'').trim() || CURRENT_USER?.username || 'You';
  const userPhoto = CURRENT_USER?.photo;
  const ini       = initials(userName);
  const sinceDate = assignment.assigned_at ? new Date(assignment.assigned_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';

  // Pending tasks count
  const pendingCount   = tasks.filter(t => t.status !== 'completed' && t.status !== 'cancelled').length;
  const completedCount = tasks.filter(t => t.status === 'completed').length;

  layout.innerHTML =
    // ── LEFT: Identity Card ────────────────────────────────────────────
    '<div class="id-card" id="idCard">' +
      '<div class="id-card-banner">' +
        '<div class="id-card-av-wrap">' +
          '<div class="id-av">' +
            (userPhoto ? '<img src="' + esc(userPhoto) + '">' : ini) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="id-body">' +
        '<div class="id-name">' + esc(userName) + '</div>' +
        '<div class="id-role-title">' +
          '<i class="' + esc(role.icon||'ri-briefcase-line') + '"></i>' +
          esc(role.title) +
        '</div>' +
        '<div class="id-meta">' +
          (role.department ? '<i class="ri-building-line mr-1"></i>' + esc(role.department) + '<br>' : '') +
          (assignment.notes ? '<i class="ri-sticky-note-line mr-1"></i>' + esc(assignment.notes) : '') +
        '</div>' +
        '<div class="id-since"><i class="ri-calendar-check-line"></i> Assigned ' + sinceDate + ' by ' + esc(assignment.assigned_by_name||'Admin') + '</div>' +
        '<div class="id-stats">' +
          '<div class="id-stat"><div class="id-stat-val">' + pendingCount + '</div><div class="id-stat-lbl">Active Tasks</div></div>' +
          '<div class="id-stat"><div class="id-stat-val">' + completedCount + '</div><div class="id-stat-lbl">Completed</div></div>' +
          '<div class="id-stat"><div class="id-stat-val">' + (role.duties?.length||0) + '</div><div class="id-stat-lbl">Duties</div></div>' +
          '<div class="id-stat"><div class="id-stat-val">' + (role.kpis?.length||0) + '</div><div class="id-stat-lbl">KPIs</div></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    // ── RIGHT: Content ────────────────────────────────────────────────
    '<div class="mr-content">' +

      // Description
      (role.description
        ? '<div class="mr-section">' +
            '<div class="mr-section-head">' +
              '<div class="mr-section-icon"><i class="ri-file-text-line"></i></div>' +
              '<span class="mr-section-title">Role Overview</span>' +
            '</div>' +
            '<div class="mr-section-body"><p class="desc-block">' + esc(role.description) + '</p></div>' +
          '</div>'
        : '') +

      // Duties
      '<div class="mr-section">' +
        '<div class="mr-section-head">' +
          '<div class="mr-section-icon"><i class="ri-list-check-2"></i></div>' +
          '<span class="mr-section-title">Key Duties &amp; Responsibilities</span>' +
          '<span class="mr-section-count">' + (role.duties?.length||0) + '</span>' +
        '</div>' +
        '<div class="mr-section-body">' +
          (role.duties?.length
            ? '<div class="duty-list">' +
                role.duties.map((d, i) =>
                  '<div class="duty-row">' +
                    '<div class="duty-num">' + String(i+1).padStart(2,'0') + '</div>' +
                    '<div class="duty-text">' + esc(d) + '</div>' +
                  '</div>'
                ).join('') +
              '</div>'
            : '<p style="color:var(--subtle);font-size:.84rem;text-align:center;padding:1rem 0">No duties defined yet.</p>') +
        '</div>' +
      '</div>' +

      // KPIs
      (role.kpis?.length
        ? '<div class="mr-section">' +
            '<div class="mr-section-head">' +
              '<div class="mr-section-icon"><i class="ri-bar-chart-2-line"></i></div>' +
              '<span class="mr-section-title">Key Performance Indicators</span>' +
              '<span class="mr-section-count">' + role.kpis.length + '</span>' +
            '</div>' +
            '<div class="mr-section-body">' +
              '<div class="kpi-grid">' +
                role.kpis.map(k =>
                  '<div class="kpi-card">' +
                    '<span class="kpi-dot"></span>' +
                    '<span class="kpi-text">' + esc(k) + '</span>' +
                  '</div>'
                ).join('') +
              '</div>' +
            '</div>' +
          '</div>'
        : '') +

      // Requirements
      (role.requirements?.length
        ? '<div class="mr-section">' +
            '<div class="mr-section-head">' +
              '<div class="mr-section-icon"><i class="ri-graduation-cap-line"></i></div>' +
              '<span class="mr-section-title">Requirements &amp; Qualifications</span>' +
              '<span class="mr-section-count">' + role.requirements.length + '</span>' +
            '</div>' +
            '<div class="mr-section-body">' +
              '<div class="req-list">' +
                role.requirements.map(r =>
                  '<div class="req-row"><i class="ri-check-double-line req-icon"></i>' + esc(r) + '</div>'
                ).join('') +
              '</div>' +
            '</div>' +
          '</div>'
        : '') +

      // My tasks preview
      tasks.length
        ? '<div class="mr-section">' +
            '<div class="mr-section-head">' +
              '<div class="mr-section-icon"><i class="ri-task-line"></i></div>' +
              '<span class="mr-section-title">My Assigned Tasks</span>' +
              '<span class="mr-section-count">' + tasks.length + '</span>' +
            '</div>' +
            '<div class="mr-section-body">' +
              '<div class="duty-list">' +
                tasks.map(t =>
                  '<div class="task-preview-row">' +
                    '<span class="tp-pri" style="background:' + priColor(t.priority) + '"></span>' +
                    '<span style="flex:1;font-size:.84rem">' + esc(t.description) + '</span>' +
                    (t.due_date ? '<span style="font-size:.72rem;color:var(--muted)">' + t.due_date + '</span>' : '') +
                    '<span class="tp-status tp-' + t.status.replace('-','-') + '">' + t.status + '</span>' +
                  '</div>'
                ).join('') +
              '</div>' +
              '<div class="text-right mt-2">' +
                '<a href="/projects" style="font-size:.8rem;color:var(--accent);text-decoration:none">View all projects <i class="ri-arrow-right-line"></i></a>' +
              '</div>' +
            '</div>' +
          '</div>'
        : '' +

    '</div>';
}

/* ── No-role state ─────────────────────────────────── */
async function renderNoRole(layout, tasks) {
  // Load role catalogue so staff can see available roles
  let catalogue = [];
  try {
    const d = await api('/api/roles?active_only=true');
    catalogue = d.roles || [];
  } catch {}

  const userName = (CURRENT_USER?.name||'').trim() || CURRENT_USER?.username || 'You';

  layout.innerHTML =
    '<div>' +
      '<div class="no-role-card">' +
        '<div class="no-role-icon"><i class="ri-user-unfollow-line"></i></div>' +
        '<h5 style="font-weight:700;margin-bottom:.5rem">No Role Assigned Yet</h5>' +
        '<p style="color:var(--muted);font-size:.86rem;max-width:320px;margin:0 auto">Your administrator has not assigned a role to your account. Contact your HR or admin team.</p>' +
      '</div>' +
    '</div>' +

    '<div>' +
      (catalogue.length
        ? '<div class="mr-section">' +
            '<div class="mr-section-head">' +
              '<div class="mr-section-icon" style="background:var(--primary-lt);color:var(--primary)"><i class="ri-book-open-line"></i></div>' +
              '<span class="mr-section-title">Role Catalogue</span>' +
              '<span class="mr-section-count">' + catalogue.length + ' roles</span>' +
            '</div>' +
            '<div class="mr-section-body">' +
              '<p style="font-size:.83rem;color:var(--muted);margin-bottom:1rem">These are the standard roles in your organisation:</p>' +
              '<div class="catalogue-grid">' +
                catalogue.map(r =>
                  '<div class="cat-card">' +
                    '<div class="cat-accent" style="background:' + r.color + '"></div>' +
                    '<div class="cat-body">' +
                      '<div class="cat-icon" style="background:' + r.color + '1a;color:' + r.color + '"><i class="' + esc(r.icon||'ri-briefcase-line') + '"></i></div>' +
                      '<div class="cat-title">' + esc(r.title) + '</div>' +
                      '<div class="cat-dept">' + esc(r.department||'—') + '</div>' +
                      '<div style="font-size:.72rem;color:var(--muted);margin-top:.4rem">' +
                        (r.duties?.length||0) + ' duties · ' + (r.kpis?.length||0) + ' KPIs' +
                      '</div>' +
                    '</div>' +
                  '</div>'
                ).join('') +
              '</div>' +
            '</div>' +
          '</div>'
        : '') +
    '</div>';
}

function renderError(msg) {
  document.getElementById('mrLayout').innerHTML =
    '<div style="grid-column:1/-1;text-align:center;padding:4rem">' +
      '<div style="font-size:2rem;color:var(--danger);margin-bottom:.75rem"><i class="ri-alert-line"></i></div>' +
      '<h6>Could not load role data</h6>' +
      '<p style="color:var(--muted);font-size:.85rem">' + esc(msg) + '</p>' +
      '<button onclick="loadMyRole()" style="margin-top:.75rem" class="btn-home">' +
        '<i class="ri-refresh-line mr-1"></i>Retry' +
      '</button>' +
    '</div>';
}

/* ── Utils ───────────────────────────────────────────── */
async function api(url, opts={}) {
  const res = await fetch(url, { headers:{'Content-Type':'application/json',...(opts.headers||{})}, ...opts });
  const d   = await res.json();
  if (!res.ok) throw new Error(d.error || res.statusText);
  return d;
}
function initials(name) { return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }
function priColor(p) { return {low:'#22c55e',medium:'#f59e0b',high:'#ef4444',critical:'#7c3aed'}[p]||'#94a3b8'; }
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type='success'){
  const icons={success:'ri-checkbox-circle-line',danger:'ri-close-circle-line',warning:'ri-alert-line'};
  const el=document.createElement('div'); el.className='wf-toast '+type;
  el.innerHTML='<i class="'+(icons[type]||'ri-information-line')+'"></i>'+esc(msg);
  document.getElementById('wf-toasts').appendChild(el); setTimeout(()=>el.remove(),4500);
}
</script>
{% endblock %}
